name: Atualizar painel de atividade
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.py
      - .github/workflows/activity.yml
permissions:
  contents: write
concurrency:
  group: activity-panel
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar painel com dados visíveis
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/activity.py
      - name: Salvar apenas se mudou
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-quest.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: atualizar jornada de contribuições [skip ci]'
            git push
          fi
