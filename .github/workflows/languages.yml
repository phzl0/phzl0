name: Atualizar linguagens do perfil
on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/languages.py
      - .github/workflows/languages.yml
permissions:
  contents: write
concurrency:
  group: language-dashboard
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calcular percentuais de linguagem
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/languages.py
      - name: Salvar painel atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/language-donut.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: atualizar percentuais de linguagens [skip ci]'
            git push
          fi
